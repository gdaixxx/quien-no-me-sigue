<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Limpieza SPA</title>
    <style>
        :root {
            --color-opaco: #2c3e50;
            --color-azul: #3498db;
            --color-peligro: #e74c3c;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ecf0f1;
        }

        /* Contenedor de la App */
        .main-content {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btn-delete {
            background-color: var(--color-peligro);
            color: white;
        }

        .btn-delete:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        /* --- LA CORTINA --- */
        #transition-curtain {
            position: fixed;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-opaco);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            
            /* Posición inicial: Abajo del todo */
            top: 100%; 
            
            /* Transición suave de posición y color */
            transition: top 0.7s cubic-bezier(0.65, 0, 0.35, 1), 
                        background-color 0.5s ease;
        }

        /* Clase para subir la cortina */
        #transition-curtain.active {
            top: 0;
        }

        /* Clase para el cambio a azul */
        #transition-curtain.blue {
            background-color: var(--color-azul);
        }

        #curtain-text {
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .spinner {
            margin-top: 20px;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none; /* Oculto al inicio */
        }

        #transition-curtain.blue .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>



    <div class="main-content">
        <h1>Panel de Control de Datos</h1>
        <p>Presiona el botón para simular la limpieza de tu SPA.</p>
        <button class="btn-delete" onclick="iniciarProcesoLimpieza()">Eliminar todo y reiniciar</button>
    </div>


<script>
    function iniciarProcesoLimpieza() {
        // 1. CREAMOS E INYECTAMOS (Todo dentro de la función)
        const curtain = document.createElement('div');
        curtain.id = 'transition-curtain';
        curtain.innerHTML = `
            <div id="curtain-text"></div>
            <div class="spinner"></div>
        `;
        document.body.appendChild(curtain);

        const text = document.getElementById('curtain-text');

        // 2. PEQUEÑA PAUSA (para que el navegador note que existe el div antes de animar)
        setTimeout(() => {
            // Ponemos el GIF y el mensaje
            text.innerHTML = `
                <div>
                    <img style="border-radius: 50%; max-width: 400px;" src="./assets/chatbot.gif" alt="Chatbot">
                </div>
                <div>Gracias por usarme, como tu ex</div>`;
            
            // Subimos la cortina
            curtain.classList.add('active');

            // 3. SEGUNDA PAUSA (Para leer el mensaje cruel)
            setTimeout(() => {
                curtain.classList.add('blue');
                text.innerText = "Reiniciando aplicación";

                // 4. ÚLTIMA PAUSA (Para ver el azul y el spinner antes de morir)
                setTimeout(() => {
                    localStorage.clear();
                    location.reload();
                }, 2000); // 2 segundos de pantalla azul

            }, 3000); // 3 segundos para leer lo de "tu ex"

        }, 100); 
    }
</script>
</body>
</html>
